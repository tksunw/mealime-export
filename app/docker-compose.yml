# eyeball (Debian 12): /etc/docker/containers/recipes/docker-compose.yml
# Needs: Docker on eyeball, export dir copied to /srv/recipes/export,
# *.tainik.net fullchain.pem + privkey.pem pushed by the Ansible cert play into ./certs
services:
  recipes:
    build:
      context: /path/to/MealimeExtraction
      dockerfile: app/Dockerfile
    container_name: recipes
    restart: unless-stopped
    read_only: true
    ports:
      - "8443:8443"
    environment:
      CERT_DIR: /certs
      TICKTICK_LIST: Grocery  # list name; token from `python3 app/ticktick.py auth` goes to ./state/ticktick.json
    env_file: .env  # ANTHROPIC_API_KEY=... (chmod 600); without it URL import skips the AI pass
    volumes:
      - /srv/recipes/export:/export:ro
      - ./certs:/certs:ro
      - ./state:/state
