# eyeball (Debian 12): /etc/docker/containers/recipes/docker-compose.yml
# Needs: Docker on eyeball, recipes (Mealime export + URL imports, one tree: json/ images/ *.md)
# at /srv/recipes/data owned by uid 1000, backed up nightly to tank:/ssd/recipes (see PLAN.md),
# *.tainik.net fullchain.pem + privkey.pem pushed by the Ansible cert play into ./certs
services:
  recipes:
    build:
      context: /path/to/MealimeExtraction
      dockerfile: app/Dockerfile
    container_name: recipes
    restart: unless-stopped
    read_only: true
    ports:
      - "8443:8443"
    environment:
      CERT_DIR: /certs
      IMPORT_DIR: /export  # imports land next to the Mealime export, one dir to back up
      TICKTICK_LIST: Grocery  # list name; API key goes in ./state/ticktick.json as {"access_token": "..."}
    env_file: .env  # ANTHROPIC_API_KEY=... (chmod 600); without it URL import skips the AI pass
    volumes:
      - /srv/recipes/data:/export
      - ./certs:/certs:ro
      - ./state:/state
